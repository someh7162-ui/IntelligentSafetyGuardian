worker_processes 1;
pid /home/teach/wt/riderguard/nginx/nginx.pid;
error_log /home/teach/wt/riderguard/logs/web-error.log warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /home/teach/wt/riderguard/logs/web-access.log;
    client_body_temp_path /home/teach/wt/riderguard/nginx/client_temp;
    proxy_temp_path /home/teach/wt/riderguard/nginx/proxy_temp;
    sendfile on;
    server {
        listen 127.0.0.1:18766;
        server_name localhost;
        root /home/teach/wt/riderguard/web;
        index index.html;
        client_max_body_size 2m;
        location /prod-api/ {
            proxy_pass http://127.0.0.1:18080/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 65s;
        }
        location /_AMapService/ {
            proxy_pass http://127.0.0.1:18080;
            proxy_set_header Host $host;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
